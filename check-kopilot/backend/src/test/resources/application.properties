# 테스트 전용 오버라이드. main의 application.yml 위에 얹힌다.
#
# OpenAI 자동 구성은 빈 api-key를 거부하고 기동 시점에 터진다(Anthropic은 허용했다).
# SpringBootTest는 LLM을 호출하지 않으므로 더미 키로 컨텍스트만 뜨게 한다.
# 실제 호출이 일어나는 코드 경로는 스텁 ChatModel로 검증한다(ChatServiceTest).
#
# OPENAI_API_KEY가 있으면 실 키를 쓴다 — EvalRunner(RUN_EVAL=true)가 실제로 LLM을 호출해야 한다.
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key-never-used}
