apiVersion: apps/v1
kind: Deployment
metadata:
  name: kopilot-backend
  labels:
    app: kopilot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kopilot-backend
  template:
    metadata:
      labels:
        app: kopilot-backend
    spec:
      imagePullSecrets:
      - name: ncr-secret
      containers:
      - name: backend
        image: team3-registry.ncr.fin-ntruss.com/kopilot-backend:4ac9375
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://192.168.152.6:3306/kopilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
        - name: SPRING_DATASOURCE_USERNAME
          value: "kopilot"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: mysql-password
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: openai-api-key
        - name: SPRING_DATA_REDIS_HOST
          value: "cache-48sg4s-fkr.cdb.fin-ntruss.com"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        # 아래 4개는 backend-secret에 키 추가 필요(openai-api-key, check-cust-id, check-api-key, admin-token)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: openai-api-key
        - name: CHECK_CUST_ID
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: check-cust-id
        - name: CHECK_API_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: check-api-key
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: admin-token
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "500m"
            memory: "1Gi"