server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드 K8s Service로 /api 프록시. 같은 네임스페이스라 짧은 서비스명(DNS)으로 충분하다.
    location /api/ {
        proxy_pass http://kopilot-backend-svc/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 채팅 SSE는 청크를 즉시 흘려보내야 한다 — 버퍼링하면 이벤트가 지연/뭉쳐서 도착한다.
        proxy_buffering off;
        proxy_read_timeout 200s;   # ChatController의 SSE 타임아웃(180s)보다 여유 있게
    }

    # React Router 등 클라이언트 라우팅 — 정적 파일이 없으면 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }
}
