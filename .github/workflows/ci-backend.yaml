name: CI Backend

on:
  push:
    branches: [ "prod", "dev" ]
    paths:
      - 'check-kopilot/backend/**'
  pull_request:
    branches: [ "prod", "dev" ]
    paths:
      - 'check-kopilot/backend/**'

jobs:
  build:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      working-directory: ./check-kopilot/backend
      run: chmod +x gradlew
        
    - name: Build Backend (Spring Boot)
      working-directory: ./check-kopilot/backend
      run: ./gradlew build
