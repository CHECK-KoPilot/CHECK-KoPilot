name: 버그
description: 동작하지 않거나 기대와 다른 결과
title: "[Bug] "
labels: ["type/fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: 증상
      description: 무엇이 어떻게 잘못됐는지.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 · 스크린샷
      description: 스택트레이스, 응답 JSON, 화면 캡처 등.
      render: shell

  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "backend / macOS / MySQL 8 · 또는 frontend / Chrome"
